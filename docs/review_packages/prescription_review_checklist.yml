# Prescription source validation — machine-readable record (HARDENED)
# Phase: F-source-validation-official-hardening · 2026-06-24
#
# INTERNAL ONLY. Records the official-source validation of the prescription
# candidate sources F1-F6. Every entry is NON-PUBLIC: `public_display: NO`.
# Nominal terms recorded here are INTERNAL candidates tied to the official
# instrument; they are NEVER shown on the public site, NEVER used by the
# calculator, and the Studio must still confirm the current consolidated text
# and the case-specific modifiers before any use.
#
# HARD INVARIANTS (asserted by apps/core/test_prescription_review_package.py):
#   - no status is `approved_for_public_display` or `public_approved`.
#   - no internal state ("source_verified*", "internal_only", "unresolved",
#     "manual_review_required", "da validare") ever appears in a PUBLIC template.
#   - no numeric prescription term appears in a PUBLIC template.
#
# ALLOWED internal status vocabulary (final):
#   source_verified_official_internal_only    instrument verified official; term recorded internal-only
#   source_verified_official_limited_scope    verified official but valid only for a narrow scope
#   source_verified_official_procedure_only   verified official, validated only for its procedural role
#   not_found_in_official_sources             NO readable official source found after a documented search
#   excluded_from_public_display              deliberately kept out of any public surface
# FORBIDDEN as a final status: manual_review_required, unresolved_for_chatgpt_or_human_validation,
#                              approved_for_public_display, public_approved

meta:
  phase: F-source-validation-official-hardening
  date: "2026-06-24"
  public_activation: none
  approved_for_public_display: false
  public_approved: false
  not_found_count: 0
  note: >-
    Italian official portals (Normattiva; Gazzetta caricaArticolo/detail) are
    JavaScript-rendered and the IVASS CAP PDF text layer is FlateDecode-
    compressed, so article BODIES were not auto-extractable; instrument identity
    and (where the index loaded) article location were confirmed across two
    passes. Nominal terms below are the established statutory provisions tied to
    each official instrument, recorded INTERNAL-ONLY at the owner's direction,
    pending the Studio's consolidated-text confirmation. EUR-Lex (F6) was fully
    readable.

sources:
  - source_id: it-cc-prescription-2947
    title: Codice Civile (R.D. 16 marzo 1942, n. 262)
    ente: Stato / Normattiva · Gazzetta Ufficiale
    article: "2947 (co.1, co.2, co.3); 2935; 2943-2945; 2946"
    scope: illeciti civili (tutti)
    official_url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:regio.decreto:1942-03-16;262"
    source_type: official_primary
    status: source_verified_official_internal_only
    term_internal: >-
      Art. 2947: cinque anni per il diritto al risarcimento del danno da fatto
      illecito (co.1); due anni per il danno da circolazione di veicoli (co.2);
      se il fatto e' considerato dalla legge come reato con prescrizione piu'
      lunga, si applica quest'ultima anche all'azione civile (co.3).
    limit: >-
      Non sufficiente per calcolare il caso: decorrenza (art. 2935), atti
      interruttivi/sospensivi (artt. 2943-2945), rilevanza penale e conoscenza
      del danno dipendono dal caso concreto e dalla verifica professionale.
    public_display: "NO"
    public_display_reason: termine non auto-determinabile dai soli input; richiede valutazione professionale
    search_notes: >-
      Gazzetta caricaArticolo = "Gazzetta in fase di caricamento" (JS);
      Normattiva (uri-res e caricaDettaglioAtto) = shell/indice JS (strumento
      R.D. 262/1942 confermato; libro VI non nell'estratto). URL canonico sopra.

  - source_id: it-inail-tu-1124-1965-art112
    title: Testo Unico INAIL (D.P.R. 30 giugno 1965, n. 1124)
    ente: Stato / INAIL · Normattiva
    article: "112 (co.1); 111"
    scope: prestazioni INAIL (infortunio sul lavoro / malattia professionale)
    official_url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1965-06-30;1124"
    source_type: official_primary
    status: source_verified_official_limited_scope
    term_internal: >-
      Art. 112 co.1: prescrizione triennale (tre anni) per le azioni dirette a
      conseguire le PRESTAZIONI INAIL. Sospensione durante la procedura di
      liquidazione (Cass. SU n. 11928/2019).
    limit: >-
      Vale SOLO per le prestazioni INAIL. Il danno differenziale civilistico e
      il risarcimento ordinario verso il datore seguono altre regole
      (art. 2947 c.c. o termine contrattuale art. 2946/2087) e non vanno equiparati.
    public_display: "NO"
    public_display_reason: ambito ristretto (prestazioni INAIL) + sospensione caso-specifica
    search_notes: >-
      Normattiva: indice ufficiale conferma art. 112 (Capo V - Prestazioni,
      storico aggiornamenti); corpo non estratto (JS). Circolari INAIL ufficiali
      confermano triennio + sospensione in liquidazione.

  - source_id: it-l-24-2017-gelli-art7
    title: Legge 8 marzo 2017, n. 24 (Gelli-Bianco)
    ente: Stato / Gazzetta Ufficiale
    article: "7"
    scope: responsabilità sanitaria (struttura / esercente)
    official_url: "https://www.gazzettaufficiale.it/eli/id/2017/03/17/17G00041/sg"
    source_type: official_primary
    status: source_verified_official_internal_only
    term_internal: >-
      Art. 7: la struttura sanitaria/sociosanitaria (pubblica o privata) risponde
      ai sensi degli artt. 1218 e 1228 c.c. (responsabilita' contrattuale);
      l'esercente la professione sanitaria risponde ai sensi dell'art. 2043 c.c.
      (extracontrattuale), salvo che abbia agito in adempimento di obbligazione
      contrattuale. Il termine dipende quindi dalla qualificazione (contrattuale
      vs extracontrattuale).
    limit: >-
      Nessun termine unico: dipende dalla qualificazione del rapporto e dalla
      decorrenza dalla conoscenza del danno. Da non trasformare in numero pubblico.
    public_display: "NO"
    public_display_reason: termine dipende dalla qualificazione giuridica del rapporto
    search_notes: >-
      Gazzetta eli/17G00041: legge confermata (GU n.64 17-03-2017); corpo art. 7
      non nell'estratto. Art. 7 e' l'articolo operativo della responsabilita'.

  - source_id: it-dlgs-206-2005-consumo-art125-126
    title: Codice del Consumo (D.Lgs. 6 settembre 2005, n. 206)
    ente: Stato / Normattiva · Gazzetta Ufficiale · MIMIT (supporto)
    article: "125 (prescrizione); 126 (decadenza); 114-127"
    scope: danno da prodotto difettoso
    official_url: "https://www.normattiva.it/eli/id/2005/10/08/005G0232/CONSOLIDATED"
    source_type: official_primary
    status: source_verified_official_internal_only
    term_internal: >-
      Art. 125: prescrizione in tre anni (decorrenza dal giorno in cui il
      danneggiato ha o avrebbe dovuto avere conoscenza del danno, del difetto e
      dell'identita' del responsabile). Art. 126: decadenza in dieci anni dalla
      messa in circolazione del prodotto.
    limit: >-
      Doppio termine (prescrizione 3 anni + decadenza 10 anni) con dies a quo
      diversi legati alla conoscenza; concorre con l'art. 2947 c.c. Non
      pubblicabile come automatismo finche' non c'e' UI/test fail-closed dedicato.
    public_display: "NO"
    public_display_reason: doppio termine con decorrenza legata alla conoscenza; nessun automatismo
    search_notes: >-
      Normattiva CONSOLIDATED + Gazzetta detail: strumento confermato (D.Lgs.
      206/2005); artt. 125-126 nell'indice ufficiale (Titolo II); corpi non
      estratti (JS).

  - source_id: it-dlgs-209-2005-cap
    title: Codice delle Assicurazioni Private (D.Lgs. 7 settembre 2005, n. 209)
    ente: Stato / IVASS · Normattiva · Gazzetta Ufficiale
    article: "144; 145; 148"
    scope: procedura RC auto (azione diretta, richiesta risarcimento, offerta)
    official_url: "https://www.normattiva.it/eli/id/2005/10/13/005G0233/ORIGINAL"
    source_type: official_primary
    status: source_verified_official_procedure_only
    term_internal: >-
      CAP disciplina la PROCEDURA: art. 144 (azione diretta del danneggiato
      verso l'assicuratore), art. 145 (proponibilita' dell'azione / richiesta di
      risarcimento), art. 148 (procedura di risarcimento e offerta). NON contiene
      il termine di prescrizione RC auto, che resta art. 2947 c.c. + caso concreto.
    limit: >-
      Fonte PROCEDURALE soltanto. Non usare CAP come fonte autonoma del termine
      di prescrizione RC auto.
    public_display: "NO"
    public_display_reason: fonte procedurale, non del termine prescrizionale
    search_notes: >-
      IVASS Cap.pdf = stream FlateDecode compresso (non estraibile);
      Normattiva eli/005G0233 = JS. Strumento ufficiale identificato.

  - source_id: eu-reg-864-2007-rome-ii
    title: Regolamento (CE) 864/2007 (Roma II)
    ente: UE / EUR-Lex
    article: "4 (regola generale); 5 (prodotto); 15 (ambito); 31-32 (applicazione temporale)"
    scope: casi internazionali / obbligazioni extracontrattuali
    official_url: "https://eur-lex.europa.eu/legal-content/IT/TXT/?uri=CELEX:32007R0864"
    source_type: official_primary
    status: source_verified_official_internal_only
    term_internal: >-
      Testo ufficiale estratto. Art. 4 regola generale (legge del luogo del
      danno); art. 5 prodotti difettosi; art. 15 include nell'ambito della legge
      applicabile "il modo di estinzione delle obbligazioni nonche' le norme di
      prescrizione e di decadenza"; artt. 31-32 applicazione temporale. NESSUN
      termine numerico: la prescrizione segue la lex causae.
    limit: >-
      Nessun termine numerico diretto: i casi internazionali richiedono la
      qualificazione della legge applicabile (lex causae).
    public_display: "NO"
    public_display_reason: nessun termine numerico (rinvio alla legge applicabile)
    search_notes: EUR-Lex CELEX:32007R0864 pienamente leggibile; art. 15 citato.
