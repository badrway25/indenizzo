# Prescription source validation — machine-readable record
# Phase: F-source-validation-official · 2026-06-24
#
# Records the OFFICIAL-SOURCE validation status of the prescription candidate
# sources (F1-F6). This validates the *normative source* (instrument/article
# existence on an official site), NOT the public usability of any term.
#
# HARD INVARIANTS (asserted by apps/core/test_prescription_review_package.py):
#   - status NEVER becomes `approved_for_public_display`.
#   - no numeric prescription term is recorded here (terms stay candidates in the
#     audit, pending article-body validation by the Studio).
#   - `source_verified_official` means "the official source/instrument is real
#     and identifiable", NOT "the public site may show a term".
#
# status vocabulary:
#   source_verified_official                 instrument identified + readable on an official site
#   source_verified_official_procedure_only  official instrument verified, validated only for its procedural role
#   unresolved_for_chatgpt_or_human_validation  official source not extractable in this pass (manual open needed)
#   rejected_unofficial                      only non-official sources found (NOT used)
# source_type: official_primary | official_secondary | unofficial_not_used

meta:
  phase: F-source-validation-official
  date: "2026-06-24"
  public_activation: none
  approved_for_public_display: false
  numeric_terms_recorded: false
  note: >-
    Official sites (Normattiva, parts of Gazzetta caricaArticolo) are
    JavaScript-rendered; article bodies were often not extractable by an
    automated fetch. Instrument identity and (where the official index loaded)
    article existence were confirmed; article bodies/terms require a manual open
    on the official portal by the Studio.

