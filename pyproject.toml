[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | \.venv
  | staticfiles
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F", "W", "I", "B", "UP"]
"config/settings.py" = ["E501"]
