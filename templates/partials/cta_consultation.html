{% load i18n %}
{# CTA primario verso il form interno /contact/ (F6). Il sito madre resta #}
{# linkato come secondario nel footer e nella pagina di thank-you. #}
{% if variant == "header" %}
  <a href="{% url 'crm:contact' %}" class="premium-btn premium-btn-primary premium-btn-sm">
    {% translate "Request legal review" %}
    <span class="cta-arrow" aria-hidden="true">→</span>
  </a>
{% else %}
  <a href="{% url 'crm:contact' %}" class="premium-btn premium-btn-primary premium-btn-block">
    {% translate "Request legal review" %}
    <span class="cta-arrow" aria-hidden="true">→</span>
  </a>
{% endif %}
