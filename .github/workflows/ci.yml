name: CI quality gate

# Iter: F-p1-ci-1-ci-quality-gate.
#
# Ports the consolidated local quality gate (see
# docs/qa/LOCAL_QUALITY_GATE.md) to GitHub Actions. Mirror of the
# stages a developer runs locally via `bash scripts/run_quality_gate.sh`:
#
#   1. python manage.py check                                       (python-tests)
#   2. pytest -q                                                    (python-tests)
#   3. python scripts/audit_legal_content_hygiene.py --strict       (python-tests)
#   4. python scripts/legal_data/audit_non_it_readiness.py          (python-tests)
#   5. bash scripts/run_lighthouse_local.sh                         (lighthouse-desktop)
#   6. bash scripts/run_lighthouse_mobile_local.sh                  (lighthouse-mobile, opt-in)
#
# The mobile audit is intentionally opt-in (workflow_dispatch only)
# because mobile-throttling Lighthouse adds ~2 min and carries the
# documented ~±0.05 perf jitter — keeping it default-on would
# generate noise. See docs/qa/LIGHTHOUSE_MOBILE_BASELINE.md §7.
#
# Companion (NOT modified by this batch):
# .github/workflows/public-site-audit.yml runs the legacy Playwright
# structural audit; it is orthogonal to this quality gate.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests + content hygiene + non-IT readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Safety env: CI stays fully self-contained — no external
      # services, no real production secrets.
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "django-insecure-ci-quality-gate-dummy-key"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      PEXELS_ENABLED: "false"
      LEAD_NOTIFICATION_ENABLED: "false"
      SENTRY_DSN: ""
      ADMIN_MFA_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations (sqlite)
        run: python manage.py migrate --noinput

      - name: pytest
        run: pytest -q

      - name: Deontological content hygiene (--strict)
        run: python scripts/audit_legal_content_hygiene.py --strict

      - name: Non-IT readiness audit
        run: python scripts/legal_data/audit_non_it_readiness.py

      # i18n no-regression gate (C1). Measures REAL coverage: a string counts
      # as translated only if its msgstr is non-empty AND not `#, fuzzy`
      # (fuzzy = a guessed/stale translation that msgfmt skips, so the page
      # renders English). Floors are set just below the honest real coverage,
      # NOT the fuzzy-inflated number. Full legal translation remains a Studio
      # deliverable; this gate prevents silent regression.
      - name: i18n translation coverage gate
        run: python scripts/check_po_coverage.py --min it=46 --min fr=35 --min ar=35

  production-checks:
    # P1-CI-1A. Runs `manage.py check` with DEBUG=False + simulated
    # signed env vars, so the production-only system checks
    # (`core.E001/E002/E003/E004/E006/E007/E008`, `compliance.E001`,
    # `jurisdictions.E001`) actually execute. The `python-tests` job
    # runs in DEBUG=true to exercise the test surface; this job runs
    # in DEBUG=false to verify the deploy gate stays green.
    #
    # NONE of the env values below is a real secret. They are
    # plausible-shaped placeholders chosen specifically to pass each
    # production-blocking check. A real production deploy uses real
    # signed values supplied out-of-band by the Studio.
    name: Production-like system checks (DEBUG=false)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-not-real-secret-key-only-for-checks-must-be-fifty-chars-XXXXX"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

      # Lead notification — enabled to exercise the LeadNotificationConfig
      # check, but to-emails resolve only to the test sink.
      LEAD_NOTIFICATION_ENABLED: "true"
      LEAD_NOTIFICATION_TO_EMAILS: "ci@example.invalid"

      # core.E001 — Studio professional identification (placeholder, not real).
      STUDIO_LEAD_LAWYER_NAME: "Avv. Test CI"
      STUDIO_BAR_ASSOCIATION: "Ordine Test CI"
      STUDIO_VAT_NUMBER: "IT00000000000"
      STUDIO_PEC_EMAIL: "ci@example.invalid"
      STUDIO_PHYSICAL_ADDRESS: "CI Test Address"
      STUDIO_PROFESSIONAL_INSURANCE_INSURER: "CI Insurance"
      STUDIO_PROFESSIONAL_INSURANCE_POLICY: "CI-POLICY-001"

      # core.E002 / core.E003 — CSP must be enforcing in prod.
      CSP_ENABLED: "true"
      CSP_REPORT_ONLY: "false"

      # core.E004 — consent notice versions must be signed.
      PRIVACY_NOTICE_VERSION: "2026-05-10-final"
      SPECIAL_CATEGORIES_NOTICE_VERSION: "2026-05-10-final"

      # core.E006 / core.E007 — public legal pages must be signed.
      PRIVACY_POLICY_VERSION: "2026-05-10-final"
      PRIVACY_POLICY_STATUS: "signed"
      PRIVACY_POLICY_SIGNED_AT: "2026-05-10"
      DISCLAIMER_VERSION: "2026-05-10-final"
      DISCLAIMER_STATUS: "signed"
      DISCLAIMER_SIGNED_AT: "2026-05-10"

      # compliance.E001 — retention policy must be signed + mode valid.
      RETENTION_POLICY_VERSION: "2026-05-10-final"
      RETENTION_ENABLED: "false"
      RETENTION_MODE: "anonymize"

      # core.E008 — professional mandate must be signed.
      MANDATE_TEMPLATE_VERSION: "2026-05-10-final"
      MANDATE_TEMPLATE_STATUS: "signed"
      MANDATE_TEMPLATE_SIGNED_AT: "2026-05-10"
      REQUIRE_MANDATE_BEFORE_CASE_ACTIVATION: "true"

      # External services explicitly disabled.
      CRM_WEBHOOK_ENABLED: "false"
      PEXELS_ENABLED: "false"
      SENTRY_DSN: ""
      ADMIN_MFA_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production-like Django system check
        run: python manage.py check

      # Django deploy security audit (security.W004/W008/W009/W012/W016/
      # W018/W020 …). Runs only here, under DEBUG=False with the signed
      # placeholder env, so a regression in any hardening flag (SSL
      # redirect, HSTS, secure cookies, SECRET_KEY strength, ALLOWED_HOSTS)
      # fails CI instead of being caught only by the manual deploy gate.
      # `--fail-level WARNING` makes it a hard gate; the single deliberate
      # security.W021 (HSTS preload opt-in) is silenced in settings via
      # SILENCED_SYSTEM_CHECKS.
      - name: Production deploy security audit (check --deploy)
        run: python manage.py check --deploy --fail-level WARNING

  lighthouse-desktop:
    name: Lighthouse desktop (perf / a11y / best / seo budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "django-insecure-ci-quality-gate-dummy-key"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      PEXELS_ENABLED: "false"
      LEAD_NOTIFICATION_ENABLED: "false"
      SENTRY_DSN: ""
      ADMIN_MFA_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations (sqlite)
        run: python manage.py migrate --noinput

      - name: Install gettext (msgfmt for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile translations
        run: python manage.py compilemessages -l fr -l ar -l it

      - name: Pre-compress static .gz companions (P2-PERF-1)
        run: python manage.py precompress_static

      - name: Start Django dev server (background)
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload \
            > runserver.log 2>&1 &
          echo $! > runserver.pid

      - name: Wait for /healthz/
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/ > /dev/null; then
              echo "server up after $i attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up; runserver.log:"
          cat runserver.log || true
          exit 1

      - name: Lighthouse desktop gate
        run: bash scripts/run_lighthouse_local.sh

      - name: Upload Lighthouse desktop artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-reports
          path: artifacts/lighthouse/latest/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Django dev server
        if: always()
        run: |
          if [ -f runserver.pid ]; then
            kill "$(cat runserver.pid)" || true
          fi

  lighthouse-mobile:
    name: Lighthouse mobile (opt-in — workflow_dispatch only)
    # Opt-in: this job runs only on manual dispatch. Default PR runs
    # are NOT slowed by the mobile audit. Mobile-throttling adds
    # ~2 min and carries documented ~±0.05 perf jitter that is real
    # signal but flaps on tight floors — keeping the mobile gate
    # manual matches the local convention
    # (`bash scripts/run_quality_gate.sh --mobile-lighthouse`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "django-insecure-ci-quality-gate-dummy-key"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      PEXELS_ENABLED: "false"
      LEAD_NOTIFICATION_ENABLED: "false"
      SENTRY_DSN: ""
      ADMIN_MFA_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations (sqlite)
        run: python manage.py migrate --noinput

      - name: Install gettext (msgfmt for compilemessages)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile translations
        run: python manage.py compilemessages -l fr -l ar -l it

      - name: Pre-compress static .gz companions (P2-PERF-1)
        run: python manage.py precompress_static

      - name: Start Django dev server (background)
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload \
            > runserver.log 2>&1 &
          echo $! > runserver.pid

      - name: Wait for /healthz/
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/ > /dev/null; then
              echo "server up after $i attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up; runserver.log:"
          cat runserver.log || true
          exit 1

      - name: Lighthouse mobile gate
        run: bash scripts/run_lighthouse_mobile_local.sh

      - name: Upload Lighthouse mobile artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: artifacts/lighthouse-mobile/latest/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Django dev server
        if: always()
        run: |
          if [ -f runserver.pid ]; then
            kill "$(cat runserver.pid)" || true
          fi
