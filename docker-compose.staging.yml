# Docker Compose for staging.
#
# NON è un file production-ready out-of-the-box: davanti serve un nginx
# con TLS, e il backup DB + media va schedulato a parte. Vedi
# docs/deploy/STAGING_DEPLOY.md per la procedura completa.
#
# Pre-condizioni:
#   1. Copia .env.staging.example -> .env.staging e popola i secret.
#   2. Genera DJANGO_SECRET_KEY (vedi STAGING_DEPLOY.md §3).
#   3. Posiziona PDF G.U. + CSV TUN in legal_data/sources/italy/tun_2025/.
#
# Avvio:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-badrane_staging}
      POSTGRES_USER: ${POSTGRES_USER:-badrane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-badrane} -d ${POSTGRES_DB:-badrane_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Porta NON esposta su host: solo accessibile dalla rete docker.
    expose:
      - "5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: badrane-legaltech:staging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tutte le env passano attraverso `--env-file .env.staging`. Qui
      # impostiamo solo override compose-specifici e default sicuri.
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env.staging}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-staging.studiolegalebadrane.it}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://staging.studiolegalebadrane.it}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-2592000}
      DATABASE_URL: postgres://${POSTGRES_USER:-badrane}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-badrane_staging}
      LANGUAGE_CODE: ${LANGUAGE_CODE:-it}
      TIME_ZONE: ${TIME_ZONE:-Europe/Rome}
      SITE_NAME: ${SITE_NAME:-Simulatore Risarcimenti Studio Legale Badrane}
      SITE_DOMAIN: ${SITE_DOMAIN:-staging.studiolegalebadrane.it}
      PARENT_SITE_URL: ${PARENT_SITE_URL:-https://international.studiolegalebadrane.it/}
    volumes:
      # Persistenza:
      # - media_data: PDF reports generati + LegalSourceAttachment binari
      # - staticfiles_data: output di collectstatic (servito da nginx)
      # - ./legal_data:/app/legal_data: PDF G.U., CSV, exports.
      #   Mountato READ-WRITE perché il command `export_italy_tun_dataset`
      #   scrive in `legal_data/exports/`. Per estra protezione delle
      #   sources, considera bind mount separato:
      #       ./legal_data/sources:/app/legal_data/sources:ro
      #       legal_data_exports:/app/legal_data/exports
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
      - ./legal_data:/app/legal_data
    expose:
      - "8000"
    # Il command qui fa:
    # 1. migrate (idempotente)
    # 2. collectstatic (idempotente, output in volume staticfiles_data)
    # 3. gunicorn (l'healthcheck del Dockerfile copre il liveness)
    # In prod davanti va un nginx con TLS che monta i volumi static/media
    # in read-only e proxy_pass al web container.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application
                  --bind 0.0.0.0:8000
                  --workers ${GUNICORN_WORKERS:-3}
                  --timeout ${GUNICORN_TIMEOUT:-60}
                  --access-logfile -
                  --error-logfile -"

volumes:
  postgres_data:
  media_data:
  staticfiles_data:
